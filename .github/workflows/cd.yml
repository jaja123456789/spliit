name: Create and publish a Docker image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` alone leaves no way to tell two builds apart, so every image also gets the
          # package.json version and an immutable short-sha tag. Manually dispatched runs have no
          # tag ref, and would otherwise publish `latest` and nothing else.
          #
          # The semver entries normalise a `v0.1.2` git tag to `0.1.2` so it does not duplicate the
          # package.json tag, and add a rolling `0.1` to pin against. They only apply to tags that
          # parse as semver; anything else still gets latest, the version and the sha.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.pkg.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          # The magic caching part:
          cache-from: type=gha
          cache-to: type=gha,mode=max
